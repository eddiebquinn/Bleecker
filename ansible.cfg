[defaults]
forks = 5
inventory = inventory/hosts.yml
remote_user = semaphore-agent
stdout_callback = default
result_format = yaml
force_color = True
host_key_checking = True
deprecation_warnings = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
roles_path = roles

[ssh_connection]
pipelining = True
ssh_args = -o UserKnownHostsFile=.ansible/known_hosts -o StrictHostKeyChecking=yes

[persistent_connection]
# Persistent command timeout for network_cli sessions (RouterOS, etc.).
# 600s gives safe headroom over the ~120s a detailed /interface print
# can take on a CRS328, plus margin for the slowest single-task cases
# observed during Argus 1.1. Per Ansible's config reference, this is the
# only knob that takes effect — `ansible_persistent_command_timeout`
# as a vars: entry is silently ignored.
command_timeout = 600

[privilege_escalation]
become_timeout = 30
