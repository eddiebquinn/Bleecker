---
# opnsense_firewall defaults — Argus Phase 1.1
#
# Data-driven definitions for blackice-1 OPNsense firewall state.
# Based on discovered-state baseline captured on 2026-07-27.
#
# Omit parameter to skip enforcement of that section.
# All enforcement uses the OPNsense REST API (ansible.builtin.uri).

# ── API connection ──
opn_api_host: "{{ hostvars[inventory_hostname]['ansible_host'] | default('10.67.45.1') }}"
opn_api_key: "{{ lookup('env', 'OPNSENSE_SEMAPHORE_KEY') }}"
opn_api_secret: "{{ lookup('env', 'OPNSENSE_SEMAPHORE_SECRET') }}"

# ── VLAN subinterface definitions ──
# Each VLAN has: name, vlan_id, parent interface, IP address, CIDR.
# These are used to verify the current config matches desired state.
# Phase 3 (L3 conversion) will update these if IPs are renumbered.
opn_vlans:
  - name: "vlan01"
    id: 1
    description: "Services"
    interface: "bge0"
    address: "10.67.10.1"
    subnet: "24"
    network: "10.67.10.0/24"
  - name: "vlan02"
    id: 2
    description: "Storage"
    interface: "bge0"
    address: "10.67.20.1"
    subnet: "24"
    network: "10.67.20.0/24"
  - name: "vlan03"
    id: 3
    description: "DMZ"
    interface: "bge0"
    address: "10.67.30.1"
    subnet: "24"
    network: "10.67.30.0/24"
  - name: "vlan04"
    id: 4
    description: "Infrastructure"
    interface: "bge0"
    address: "10.67.40.1"
    subnet: "24"
    network: "10.67.40.0/24"
  - name: "vlan05"
    id: 5
    description: "Management"
    interface: "bge0"
    address: "10.67.45.1"
    subnet: "24"
    network: "10.67.45.0/24"
  - name: "vlan06"
    id: 6
    description: "Guest"
    interface: "bge0"
    address: "10.67.50.1"
    subnet: "24"
    network: "10.67.50.0/24"
  - name: "vlan07"
    id: 7
    description: "Endpoints"
    interface: "bge0"
    address: "10.67.60.1"
    subnet: "24"
    network: "10.67.60.0/24"
  - name: "vlan08"
    id: 8
    description: "IoT"
    interface: "bge0"
    address: "10.67.70.1"
    subnet: "24"
    network: "10.67.70.0/24"
  - name: "vlan09"
    id: 9
    description: "ISPRouter"
    interface: "bge0"
    address: "10.67.71.1"
    subnet: "24"
    network: "10.67.71.0/24"

# ── Firewall rules ──
# Each rule maps to an OPNsense firewall rule API object.
# Source: discovered-state/blackice-1/04-firewall-rules.json
opn_firewall_rules:
  - description: "Matrix HTTPS"
    action: "pass"
    direction: "in"
    interface: "wan"
    protocol: "tcp"
    source_net: "any"
    destination_net: "wanip"
    destination_port: "443"
    target: "10.67.30.24"
    enabled: true
  - description: "Matrix Federation"
    action: "pass"
    direction: "in"
    interface: "wan"
    protocol: "tcp"
    source_net: "any"
    destination_net: "wanip"
    destination_port: "8448"
    target: "10.67.30.24"
    enabled: true
  - description: "Syncthing"
    action: "pass"
    direction: "in"
    interface: "wan"
    protocol: "tcp/udp"
    source_net: "any"
    destination_net: "10.67.10.26"
    destination_port: "22000"
    enabled: true
  - description: "Services block Management"
    action: "block"
    direction: "in"
    interface: "Services"
    protocol: "any"
    source_net: "10.67.10.0/24"
    destination_net: "10.67.45.0/24"
    enabled: true
  - description: "Storage block Management"
    action: "block"
    direction: "in"
    interface: "Storage"
    protocol: "any"
    source_net: "10.67.20.0/24"
    destination_net: "10.67.45.0/24"
    enabled: true
  - description: "DMZ block Management"
    action: "block"
    direction: "in"
    interface: "DMZ"
    protocol: "any"
    source_net: "10.67.30.0/24"
    destination_net: "10.67.45.0/24"
    enabled: true
  - description: "Management is a sink"
    action: "block"
    direction: "out"
    interface: "Management"
    protocol: "any"
    source_net: "10.67.45.0/24"
    destination_net: "any"
    enabled: true
  - description: "Guest internet only"
    action: "pass"
    direction: "in"
    interface: "Guest"
    protocol: "any"
    source_net: "10.67.50.0/24"
    destination_net: "RFC1918"
    enabled: true
  - description: "Guest block RFC1918"
    action: "block"
    direction: "in"
    interface: "Guest"
    protocol: "any"
    source_net: "10.67.50.0/24"
    destination_net: "RFC1918"
    enabled: true
  - description: "IoT internet only"
    action: "pass"
    direction: "in"
    interface: "IoT"
    protocol: "any"
    source_net: "10.67.70.0/24"
    destination_net: "RFC1918"
    enabled: true
  - description: "IoT block RFC1918"
    action: "block"
    direction: "in"
    interface: "IoT"
    protocol: "any"
    source_net: "10.67.70.0/24"
    destination_net: "RFC1918"
    enabled: true

# ── NAT / Port Forwarding rules ──
# Source: discovered-state/blackice-1/05-nat-rules.json
opn_nat_rules:
  - description: "matrix-443"
    protocol: "tcp"
    interface: "wan"
    destination_net: "wanip"
    destination_port: "443"
    target: "10.67.30.24"
    local_port: "443"
    enabled: true
  - description: "matrix-federation"
    protocol: "tcp"
    interface: "wan"
    destination_net: "wanip"
    destination_port: "8448"
    target: "10.67.30.24"
    local_port: "8448"
    enabled: true
  - description: "Syncthing"
    protocol: "tcp/udp"
    interface: "wan"
    destination_net: "wanip"
    destination_port: "22000"
    target: "10.67.10.26"
    local_port: "22000"
    enabled: true

# ── Whether to enforce firewall rules ──
# Set to true to push the defined rules via API (DANGEROUS — may lock you out).
# Default false — role is read-only verification until Phase 3.
opn_enforce_rules: false

# ── Whether to enforce NAT rules ──
opn_enforce_nat: false
