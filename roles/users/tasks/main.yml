---
- name: Ensure Ubuntu default apt sources use stable archive mirrors
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ubuntu.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ ubuntu_archive_uri }}
      Suites: {{ ansible_distribution_release }} {{ ansible_distribution_release }}-updates {{ ansible_distribution_release }}-backports
      Components: main restricted universe multiverse
      Signed-By: {{ ubuntu_archive_keyring }}

      Types: deb
      URIs: {{ ubuntu_security_uri }}
      Suites: {{ ansible_distribution_release }}-security
      Components: main restricted universe multiverse
      Signed-By: {{ ubuntu_archive_keyring }}
  when:
    - ansible_facts.distribution == "Ubuntu"
    - ubuntu_manage_default_sources | bool

- name: Install baseline packages (Debian)
  ansible.builtin.apt:
    name: "{{ baseline_apt_packages }}"
    state: present
    update_cache: true
  when:
    - ansible_facts.os_family == "Debian"
    - baseline_apt_packages | length > 0

- name: Ensure eddie user exists
  ansible.builtin.user:
    name: "{{ eddie_username }}"
    groups: "{{ eddie_groups }}"
    append: true
    shell: "{{ eddie_shell }}"
    state: present
  when: users_manage_eddie | bool

- name: Check whether eddie user already exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ eddie_username }}"
  register: eddie_user_getent
  failed_when: false
  when: users_manage_eddie | bool

- name: Ensure .ssh directory for eddie
  ansible.builtin.file:
    path: "/home/{{ eddie_username }}/.ssh"
    state: directory
    owner: "{{ eddie_username }}"
    group: "{{ eddie_username }}"
    mode: "0700"
  when:
    - users_manage_eddie | bool
    - not ansible_check_mode or (eddie_user_getent.ansible_facts.getent_passwd | default({})).get(eddie_username) is not none

- name: Ensure eddie authorized keys are present
  ansible.posix.authorized_key:
    user: "{{ eddie_username }}"
    state: present
    key: "{{ item }}"
  loop: "{{ eddie_authorized_keys }}"
  when:
    - users_manage_eddie | bool
    - eddie_authorized_keys | length > 0
    - not ansible_check_mode or (eddie_user_getent.ansible_facts.getent_passwd | default({})).get(eddie_username) is not none
