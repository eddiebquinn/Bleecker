---
- name: Remove conflicting Docker packages without purging Docker data
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages_common + (docker_conflicting_packages_ubuntu if ansible_facts.distribution == 'Ubuntu' else []) }}"
    state: absent
    autoremove: false
    update_cache: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Ensure Docker apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Download Docker apt GPG key
  ansible.builtin.get_url:
    url: "{{ (docker_apt_repo_baseurl_ubuntu if ansible_facts.distribution == 'Ubuntu' else docker_apt_repo_baseurl_debian) }}/gpg"
    dest: "{{ docker_apt_keyring_path }}"
    mode: "0644"
    force: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Configure Docker apt repository
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ docker_apt_repo_filename }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ docker_apt_repo_baseurl_ubuntu if ansible_facts.distribution == 'Ubuntu' else docker_apt_repo_baseurl_debian }}
      Suites: {{ ansible_facts.lsb.codename if ansible_facts.distribution == 'Ubuntu' else ansible_facts.distribution_release }}
      Components: stable
      Architectures: {{ ansible_facts.architecture | replace('x86_64', 'amd64') }}
      Signed-By: {{ docker_apt_keyring_path }}
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Install standard Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Ensure docker-agent group exists
  ansible.builtin.group:
    name: "{{ docker_agent_name }}"
    gid: "{{ docker_agent_gid }}"
    system: true
    state: present
  when: docker_prep_enabled | bool

- name: Ensure docker-agent user exists (no password, no interactive login)
  ansible.builtin.user:
    name: "{{ docker_agent_name }}"
    uid: "{{ docker_agent_uid }}"
    group: "{{ docker_agent_name }}"
    shell: "{{ docker_agent_shell }}"
    create_home: true
    home: "{{ docker_agent_home }}"
    system: true
    password_lock: true
    state: present
  when: docker_prep_enabled | bool

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  when: docker_prep_enabled | bool

- name: Add docker-agent user to Docker group
  ansible.builtin.user:
    name: "{{ docker_agent_name }}"
    groups: docker
    append: true
  when: docker_prep_enabled | bool

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true
  when: docker_prep_enabled | bool
