---
- name: Check whether Docker CE is already installed
  ansible.builtin.command: dpkg-query -W -f='${Status}' docker-ce
  register: docker_ce_installed_check
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Decide whether Docker bootstrap can run in this execution mode
  ansible.builtin.set_fact:
    docker_bootstrap_allowed: >-
      {{ (not ansible_check_mode) or ('install ok installed' in (docker_ce_installed_check.stdout | default(''))) }}
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"

- name: Explain why Docker bootstrap is skipped during dry-run on fresh hosts
  ansible.builtin.debug:
    msg: >-
      Skipping Docker repo/package bootstrap in check mode because docker-ce is not yet installed on this host.
      Validate first-time Docker bootstrap with a real apply run instead.
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - ansible_check_mode
    - not (docker_bootstrap_allowed | default(false))

- name: Remove conflicting Docker packages without purging Docker data
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages_common + (docker_conflicting_packages_ubuntu if ansible_facts.distribution == 'Ubuntu' else []) }}"
    state: absent
    autoremove: false
    update_cache: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)

- name: Ensure Docker apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)

- name: Download Docker apt GPG key
  ansible.builtin.get_url:
    url: "{{ (docker_apt_repo_baseurl_ubuntu if ansible_facts.distribution == 'Ubuntu' else docker_apt_repo_baseurl_debian) }}/gpg"
    dest: "{{ docker_apt_keyring_path }}"
    mode: "0644"
    force: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)

- name: Configure Docker apt repository
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ docker_apt_repo_filename }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ docker_apt_repo_baseurl_ubuntu if ansible_facts.distribution == 'Ubuntu' else docker_apt_repo_baseurl_debian }}
      Suites: {{ ansible_facts.lsb.codename if ansible_facts.distribution == 'Ubuntu' else ansible_facts.distribution_release }}
      Components: stable
      Architectures: {{ ansible_facts.architecture | replace('x86_64', 'amd64') }}
      Signed-By: {{ docker_apt_keyring_path }}
  register: docker_apt_repo_config
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)

- name: Refresh apt cache after Docker repo changes
  ansible.builtin.apt:
    update_cache: true
  register: docker_apt_cache_refresh
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)
    - docker_apt_repo_config is changed

- name: Check Docker CE package candidate availability
  ansible.builtin.command: apt-cache policy docker-ce
  register: docker_ce_policy
  check_mode: false
  changed_when: false
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)

- name: Fail if Docker CE package is unavailable after repo refresh
  ansible.builtin.fail:
    msg: >-
      docker-ce is not available from configured apt sources on this host even after refreshing cache.
      apt-cache policy output:
      {{ docker_ce_policy.stdout | default('no output') }}
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)
    - "'Candidate: (none)' in (docker_ce_policy.stdout | default(''))"

- name: Install standard Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  when:
    - docker_prep_enabled | bool
    - docker_manage_packages | bool
    - ansible_facts.os_family == "Debian"
    - docker_bootstrap_allowed | default(true)

- name: Ensure docker-agent group exists
  ansible.builtin.group:
    name: "{{ docker_agent_name }}"
    gid: "{{ docker_agent_gid }}"
    system: true
    state: present
  when: docker_prep_enabled | bool

- name: Ensure docker-agent user exists (no password, no interactive login)
  ansible.builtin.user:
    name: "{{ docker_agent_name }}"
    uid: "{{ docker_agent_uid }}"
    group: "{{ docker_agent_name }}"
    shell: "{{ docker_agent_shell }}"
    create_home: true
    home: "{{ docker_agent_home }}"
    system: true
    password_lock: true
    state: present
  when: docker_prep_enabled | bool

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  when: docker_prep_enabled | bool

- name: Add docker-agent user to Docker group
  ansible.builtin.user:
    name: "{{ docker_agent_name }}"
    groups: docker
    append: true
  when: docker_prep_enabled | bool

- name: Gather service facts before managing Docker service
  ansible.builtin.service_facts:
  when: docker_prep_enabled | bool

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true
  when:
    - docker_prep_enabled | bool
    - not ansible_check_mode or (ansible_facts.services | default({})).get(docker_service_name + '.service') is not none

- name: Explain why Docker registry auth login is skipped during check mode
  ansible.builtin.debug:
    msg: >-
      Skipping persistent Docker registry login in check mode because it requires a real docker login against the target registry.
  when:
    - docker_prep_enabled | bool
    - docker_registry_auth_enabled | bool
    - ansible_check_mode

- name: Assert Docker registry auth entries are valid
  ansible.builtin.assert:
    that:
      - item.registry | default('') | length > 0
      - item.username | default('') | length > 0
      - item.password | default('') | length > 0
    fail_msg: >-
      Docker registry auth is enabled but an entry is missing registry, username, or password.
  loop: "{{ docker_registry_auth_entries }}"
  loop_control:
    label: "{{ item.registry | default('missing-registry') }}"
  when:
    - docker_prep_enabled | bool
    - docker_registry_auth_enabled | bool
    - not ansible_check_mode

- name: Ensure root Docker config directory exists for persistent registry auth
  ansible.builtin.file:
    path: /root/.docker
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - docker_prep_enabled | bool
    - docker_registry_auth_enabled | bool
    - not ansible_check_mode

- name: Persist Docker registry login for root
  ansible.builtin.command:
    argv:
      - docker
      - login
      - "{{ item.registry }}"
      - --username
      - "{{ item.username }}"
      - --password-stdin
  args:
    stdin: "{{ item.password }}"
  register: docker_registry_auth_login
  changed_when: false
  no_log: true
  loop: "{{ docker_registry_auth_entries }}"
  loop_control:
    label: "{{ item.registry }}"
  when:
    - docker_prep_enabled | bool
    - docker_registry_auth_enabled | bool
    - not ansible_check_mode
