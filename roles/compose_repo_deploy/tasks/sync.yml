---
- name: Derive compose repo paths
  ansible.builtin.include_tasks: derive.yml

- name: Include compose repo assertions
  ansible.builtin.include_tasks: assert.yml

- name: Install git (Debian)
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Ensure compose repo base directory exists
  ansible.builtin.file:
    path: "{{ compose_repo_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure compose repo directory exists with consistent ownership
  ansible.builtin.file:
    path: "{{ compose_repo_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mark compose repo path as a safe Git directory for root
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --add
      - safe.directory
      - "{{ compose_repo_dest }}"
  changed_when: false

- name: Ensure compose SSH directory exists
  ansible.builtin.file:
    path: "{{ compose_repo_ssh_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write compose repo deploy key (from CI)
  ansible.builtin.copy:
    dest: "{{ compose_repo_ssh_key_path }}"
    content: "{{ compose_repo_deploy_key_private }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write pinned known_hosts for compose git server
  ansible.builtin.copy:
    dest: "{{ compose_repo_known_hosts_path }}"
    content: "{{ compose_git_known_hosts }}"
    owner: root
    group: root
    mode: "0644"

- name: Clone/update compose repo (using pinned host key + deploy key)
  ansible.builtin.git:
    repo: "{{ compose_repo_url }}"
    dest: "{{ compose_repo_dest }}"
    version: "{{ compose_repo_branch }}"
    update: true
    force: true
    key_file: "{{ compose_repo_ssh_key_path }}"
    accept_hostkey: false
  environment:
    GIT_SSH_COMMAND: >-
      ssh
      -o UserKnownHostsFile={{ compose_repo_known_hosts_path }}
      -o StrictHostKeyChecking=yes

- name: Install Infisical CLI prerequisites (Debian)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when:
    - compose_repo_infisical_application_sync_enabled | bool
    - ansible_facts.os_family == "Debian"

- name: Install Infisical CLI (Debian)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | bash
    apt-get -qq update
    apt-get -qq install -y --no-install-recommends infisical
  args:
    creates: /usr/bin/infisical
    executable: /bin/bash
  when:
    - compose_repo_infisical_application_sync_enabled | bool
    - ansible_facts.os_family == "Debian"

- name: Assert Infisical application export variables are set
  ansible.builtin.assert:
    that:
      - compose_repo_infisical_project_id | length > 0
      - compose_repo_infisical_token | length > 0
      - compose_repo_env_exports | length > 0
      - compose_repo_env_exports | selectattr('path', 'defined') | list | length == compose_repo_env_exports | length
    fail_msg: >-
      {{ compose_repo_label }} Infisical application sync is enabled but one or more
      required compose_repo_infisical_* settings are missing.
  changed_when: false
  when: compose_repo_infisical_application_sync_enabled | bool

- name: Remove existing compose env files before Infisical export
  ansible.builtin.file:
    path: "{{ compose_repo_dest }}/{{ item.path }}"
    state: absent
  loop: "{{ compose_repo_env_exports }}"
  when: compose_repo_infisical_application_sync_enabled | bool

- name: Export compose env files from Infisical
  ansible.builtin.command:
    argv: "{{ compose_repo_infisical_export_argv }}"
  environment:
    INFISICAL_TOKEN: "{{ compose_repo_infisical_token }}"
    INFISICAL_DISABLE_UPDATE_CHECK: "true"
  loop: "{{ compose_repo_env_exports }}"
  vars:
    compose_repo_infisical_export_argv: >-
      {{ [
        'infisical',
        'export',
        '--projectId=' ~ compose_repo_infisical_project_id,
        '--env=' ~ compose_repo_infisical_env,
        '--path=' ~ (item.path_in_infisical | default('/')),
        '--domain=' ~ compose_repo_infisical_domain,
        '--format=dotenv',
        '--output-file=' ~ compose_repo_dest ~ '/' ~ item.path
      ] +
      ([ '--tags=' ~ (item.tags | join(',')) ] if (item.tags is defined and (item.tags | length > 0)) else []) }}
  no_log: true
  when: compose_repo_infisical_application_sync_enabled | bool

- name: Check exported compose env files
  ansible.builtin.stat:
    path: "{{ compose_repo_dest }}/{{ item.path }}"
  loop: "{{ compose_repo_env_exports }}"
  register: compose_repo_exported_env_file_stats
  changed_when: false
  when: compose_repo_infisical_application_sync_enabled | bool

- name: Assert exported compose env files are not empty
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - (item.stat.size | int) > 0
    fail_msg: >-
      {{ compose_repo_label }} exported env file is missing or empty at
      {{ item.stat.path | default(compose_repo_dest ~ '/' ~ item.item.path) }}.
      Check the Infisical path/tags/env settings for this application.
  loop: "{{ compose_repo_exported_env_file_stats.results | default([]) }}"
  changed_when: false
  when: compose_repo_infisical_application_sync_enabled | bool
