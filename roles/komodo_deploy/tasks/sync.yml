---
- name: Include Komodo assertions
  ansible.builtin.include_tasks: assert.yml

- name: Install git (Debian)
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Ensure Komodo repo base directory exists
  ansible.builtin.file:
    path: "{{ komodo_repo_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Komodo repo directory exists with consistent ownership
  ansible.builtin.file:
    path: "{{ komodo_repo_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mark Komodo repo path as a safe Git directory for root
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --add
      - safe.directory
      - "{{ komodo_repo_dest }}"
  changed_when: false

- name: Ensure Komodo SSH directory exists
  ansible.builtin.file:
    path: "{{ komodo_repo_ssh_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write Komodo repo deploy key (from CI)
  ansible.builtin.copy:
    dest: "{{ komodo_repo_ssh_key_path }}"
    content: "{{ komodo_repo_deploy_key_private }}"
    owner: root
    group: root
    mode: "0600"

- name: Write pinned known_hosts for Komodo git server
  ansible.builtin.copy:
    dest: "{{ komodo_repo_known_hosts_path }}"
    content: "{{ komodo_git_known_hosts }}"
    owner: root
    group: root
    mode: "0644"

- name: Clone/update Komodo repo (using pinned host key + deploy key)
  ansible.builtin.git:
    repo: "{{ komodo_repo_url }}"
    dest: "{{ komodo_repo_dest }}"
    version: "{{ komodo_repo_branch }}"
    update: true
    force: true
    key_file: "{{ komodo_repo_ssh_key_path }}"
    accept_hostkey: false
  environment:
    GIT_SSH_COMMAND: >-
      ssh
      -o UserKnownHostsFile={{ komodo_repo_known_hosts_path }}
      -o StrictHostKeyChecking=yes

- name: Install Infisical CLI prerequisites (Debian)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Install Infisical CLI (Debian)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | bash
    apt-get -qq update
    apt-get -qq install -y --no-install-recommends infisical
  args:
    creates: /usr/bin/infisical
    executable: /bin/bash
  when: ansible_facts.os_family == "Debian"

- name: Assert Infisical application export variables are set
  ansible.builtin.assert:
    that:
      - komodo_infisical_project_id | length > 0
      - komodo_infisical_token | length > 0
      - komodo_infisical_application_path | length > 0
      - komodo_infisical_core_tags | length > 0
      - komodo_infisical_periphery_tags | length > 0
    fail_msg: >-
      Standard Komodo deploy now expects Infisical application export settings.
      Set the required komodo_infisical_* variables before running deploys.
  changed_when: false

- name: Remove existing Komodo core env before Infisical export
  ansible.builtin.file:
    path: "{{ komodo_repo_dest }}/core/.env"
    state: absent

- name: Remove existing Komodo periphery env before Infisical export
  ansible.builtin.file:
    path: "{{ komodo_repo_dest }}/periphery/.env"
    state: absent

- name: Export Komodo core env from Infisical
  ansible.builtin.command:
    argv:
      - infisical
      - export
      - "--projectId={{ komodo_infisical_project_id }}"
      - "--env={{ komodo_infisical_env }}"
      - "--path={{ komodo_infisical_application_path }}"
      - "--domain={{ komodo_infisical_domain }}"
      - "--tags={{ komodo_infisical_core_tags | join(',') }}"
      - --format=dotenv
      - "--output-file={{ komodo_repo_dest }}/core/.env"
  environment:
    INFISICAL_TOKEN: "{{ komodo_infisical_token }}"
    INFISICAL_DISABLE_UPDATE_CHECK: "true"

- name: Export Komodo periphery env from Infisical
  ansible.builtin.command:
    argv:
      - infisical
      - export
      - "--projectId={{ komodo_infisical_project_id }}"
      - "--env={{ komodo_infisical_env }}"
      - "--path={{ komodo_infisical_application_path }}"
      - "--domain={{ komodo_infisical_domain }}"
      - "--tags={{ komodo_infisical_periphery_tags | join(',') }}"
      - --format=dotenv
      - "--output-file={{ komodo_repo_dest }}/periphery/.env"
  environment:
    INFISICAL_TOKEN: "{{ komodo_infisical_token }}"
    INFISICAL_DISABLE_UPDATE_CHECK: "true"
  no_log: true
