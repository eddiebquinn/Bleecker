include:
  - project: foundry/meditek
    ref: master
    file: /templates/security.yml
  - project: foundry/meditek
    ref: master
    file: /templates/validate.yml

stages:
  - scan
  - validate
  - test
  - discover
  - apply

variables:
  ANSIBLE_RUNNER_IMAGE: "r.gitlab.eddiequinn.casa/foundry/pharmex/synthcoke:abdfca84"
  ANSIBLE_CONFIG: "$CI_PROJECT_DIR/ansible.cfg"
  TARGET_HOSTS: "managed"
  DETECT_TARGETS: "managed"
  LIFECYCLE_TARGETS: "managed"
  UPDATE_TARGETS: "managed"
  PROVISION_MARKER_PATH: "/etc/markers/provisioned"

.default_ansible_job: &default_ansible_job
  image: "$ANSIBLE_RUNNER_IMAGE"
  allow_failure: false

.default_ssh_ansible_job: &default_ssh_ansible_job
  <<: *default_ansible_job
.rules_validate: &rules_validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never

.rules_test: &rules_test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never

.rules_update: &rules_update
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

.rules_manual_apply: &rules_manual_apply
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

ansible-network-validate:
  <<: *default_ansible_job
  stage: validate
  rules:
    - when: manual
      allow_failure: true
  script:
    - ansible-playbook -i inventory/hosts.yml playbooks/network/site.yml --syntax-check

ansible-network-dry-run:
  <<: *default_ansible_job
  stage: test
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is required" && exit 1)
    - mkdir -p ~/.ssh .ansible
    - chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ci_network_key
    - chmod 600 ~/.ssh/ci_network_key
    - export ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/ci_network_key
    - export OPNSENSE_SEMAPHORE_KEY
    - export OPNSENSE_SEMAPHORE_SECRET
  script:
    - ansible-playbook -i inventory/hosts.yml playbooks/network/site.yml --check --diff

ansible-network-discover-state:
  <<: *default_ssh_ansible_job
  stage: discover
  rules:
    - when: manual
      allow_failure: true
  artifacts:
    when: always
    paths:
      - discovered-state/
  before_script:
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is required" && exit 1)
    - mkdir -p ~/.ssh .ansible
    - chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ci_network_key
    - chmod 600 ~/.ssh/ci_network_key
    - export ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/ci_network_key
    - export OPNSENSE_SEMAPHORE_KEY
    - export OPNSENSE_SEMAPHORE_SECRET
  script:
    - ansible-playbook -i inventory/hosts.yml playbooks/network/discover-state.yml

ansible-validate:
  <<: *default_ansible_job
  <<: *rules_validate
  stage: validate
  script:
    - ansible-playbook -i inventory/hosts.yml playbooks/lifecycle/00-detect.yml --syntax-check
    - ansible-playbook -i inventory/hosts.yml site.yml --syntax-check
    - ansible-playbook -i inventory/hosts.yml playbooks/lifecycle/10-provision.yml --syntax-check
    - ansible-playbook -i inventory/hosts.yml playbooks/lifecycle/20-baseline.yml --syntax-check
    - ansible-playbook -i inventory/hosts.yml playbooks/lifecycle/30-apt-upgrade.yml --syntax-check
    - |
      # Skip _app.yml: it's a parameterised template that requires a
      # `compose_app_name` var to syntax-check cleanly. The 26 wrapper
      # playbooks each import it via `import_playbook` and provide that
      # var, so the template is implicitly covered when the wrappers are
      # syntax-checked.
      for f in playbooks/deploy/*.yml; do
        if [ "$(basename "$f")" = "_app.yml" ]; then
          continue
        fi
        ansible-playbook -i inventory/hosts.yml "$f" --syntax-check
      done

ansible-detect-provision-state:
  <<: *default_ssh_ansible_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never
  stage: discover
  artifacts:
    when: always
    paths:
      - detect/provisioned_hosts.txt
      - detect/unprovisioned_hosts.txt
      - detect/unreachable_hosts.txt
  before_script:
    - source .ci/ci_prepare_ssh.sh DETECT_TARGETS
    - mkdir -p detect
  script:
    - ansible-playbook -i inventory/hosts.yml playbooks/lifecycle/00-detect.yml --limit "$DETECT_TARGETS" -e "detect_targets=$DETECT_TARGETS" -e "detect_output_dir=$CI_PROJECT_DIR/detect"

ansible-discover-network-flows:
  <<: *default_ssh_ansible_job
  rules:
    - when: never
  stage: discover
  artifacts:
    when: always
    paths:
      - evidence/network-flows/
  before_script:
    - test -n "$DISCOVER_TARGETS" || export DISCOVER_TARGETS="managed"
    - source .ci/ci_prepare_ssh.sh DISCOVER_TARGETS
  script:
    - ansible-playbook -i inventory/hosts.yml playbooks/discovery/network-flows.yml --limit "$DISCOVER_TARGETS" -e "discovery_targets=$DISCOVER_TARGETS"

ansible-dry-run-lifecycle:
  <<: *default_ssh_ansible_job
  <<: *rules_test
  stage: test
  before_script:
    - source .ci/ci_prepare_ssh.sh TARGET_HOSTS
    - 'export RESOLVED_TARGETS=$(paste -sd":" /tmp/ansible_target_names.txt)'
    - |
      if [ "${DOCKER_REGISTRY_AUTH_ENABLED:-}" = "true" ]; then
        test -n "${DOCKER_REGISTRY_AUTH_REGISTRY:-}" || (echo "DOCKER_REGISTRY_AUTH_REGISTRY is required when DOCKER_REGISTRY_AUTH_ENABLED=true" && exit 1)
        test -n "${DOCKER_REGISTRY_AUTH_USERNAME:-}" || (echo "DOCKER_REGISTRY_AUTH_USERNAME is required when DOCKER_REGISTRY_AUTH_ENABLED=true" && exit 1)
        test -n "${DOCKER_REGISTRY_AUTH_PASSWORD:-}" || (echo "DOCKER_REGISTRY_AUTH_PASSWORD is required when DOCKER_REGISTRY_AUTH_ENABLED=true" && exit 1)
        python3 -c 'import json, os, pathlib; pathlib.Path("/tmp/docker-registry-auth-vars.json").write_text(json.dumps({"docker_registry_auth_enabled": True, "docker_registry_auth_entries": [{"registry": os.environ["DOCKER_REGISTRY_AUTH_REGISTRY"], "username": os.environ["DOCKER_REGISTRY_AUTH_USERNAME"], "password": os.environ["DOCKER_REGISTRY_AUTH_PASSWORD"]}]}, indent=2))'
      else
        printf '%s\n' '{"docker_registry_auth_enabled": false}' > /tmp/docker-registry-auth-vars.json
      fi
  script:
    - ansible-playbook -i inventory/hosts.yml site.yml --check --diff --limit "$RESOLVED_TARGETS" -e @/tmp/docker-registry-auth-vars.json

ansible-provision-hosts:
  <<: *default_ansible_job
  <<: *rules_manual_apply
  stage: apply
  needs:
    - job: ansible-detect-provision-state
      artifacts: true
  before_script:
    - test -n "$ANSIBLE_USER" || (echo "ANSIBLE_USER is required" && exit 1)
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is required" && exit 1)
    - test -n "$SEMAPHORE_AGENT_AUTHORIZED_KEY" || (echo "SEMAPHORE_AGENT_AUTHORIZED_KEY is required" && exit 1)
    - |
      python3 - <<'PY'
      import os
      key = os.environ.get('SEMAPHORE_AGENT_AUTHORIZED_KEY', '')
      lines = [line for line in key.splitlines() if line.strip()]
      first = lines[0].split() if lines else []
      print('SEMAPHORE_AGENT_AUTHORIZED_KEY diagnostic:')
      print(f'  raw_length={len(key)}')
      print(f'  non_empty_lines={len(lines)}')
      print(f'  first_field={first[0] if len(first) >= 1 else "<missing>"}')
      print(f'  field_count={len(first)}')
      print(f'  has_cr={chr(13) in key}')
      print(f'  starts_with_space={key[:1].isspace() if key else False}')
      print(f'  ends_with_space={key[-1:].isspace() if key else False}')
      PY
    - test -f detect/unprovisioned_hosts.txt || (echo "Detection artifact detect/unprovisioned_hosts.txt is missing" && exit 1)
    - |
      python3 - <<'PY'
      from pathlib import Path
      hosts = [line.strip() for line in Path('detect/unprovisioned_hosts.txt').read_text().splitlines() if line.strip()]
      Path('/tmp/unprovisioned_hosts.txt').write_text('\n'.join(hosts) + ('\n' if hosts else ''))
      print('Detected unprovisioned hosts: ' + (', '.join(hosts) if hosts else '<none>'))
      PY
    - |
      if [ -z "${PROVISION_TARGETS:-}" ]; then
        if [ "$(wc -l < /tmp/unprovisioned_hosts.txt)" -eq 1 ]; then
          export PROVISION_TARGETS="$(head -n 1 /tmp/unprovisioned_hosts.txt)"
          echo "PROVISION_TARGETS not set; defaulting to sole unprovisioned host: $PROVISION_TARGETS"
        else
          echo "PROVISION_TARGETS is required when there are zero or multiple unprovisioned hosts."
          echo "Available unprovisioned hosts:"
          sed 's/^/- /' /tmp/unprovisioned_hosts.txt || true
          exit 1
        fi
      fi
    - source .ci/ci_prepare_ssh.sh PROVISION_TARGETS
    - |
      python3 - <<'PY'
      import os
      from pathlib import Path
      targets = [line.strip() for line in Path('/tmp/ansible_target_names.txt').read_text().splitlines() if line.strip()]
      if not targets:
          raise SystemExit("No targets in /tmp/ansible_target_names.txt")
      unprovisioned = {line.strip() for line in Path('detect/unprovisioned_hosts.txt').read_text().splitlines() if line.strip()}
      selected = [host for host in targets if host in unprovisioned]
      Path('/tmp/ansible_selected_target_names.txt').write_text('\n'.join(selected) + ('\n' if selected else ''))
      if not selected:
          print("No unprovisioned hosts matched PROVISION_TARGETS=" + os.environ.get("PROVISION_TARGETS", ""))
          print("Available unprovisioned hosts:")
          for h in sorted(unprovisioned):
              print("  -", h)
          raise SystemExit(1)
      PY
    - |
      export RESOLVED_TARGETS=$(paste -sd":" /tmp/ansible_selected_target_names.txt)
      echo "Resolved provision targets: $RESOLVED_TARGETS"
    - |
      python3 - <<'PY'
      import os
      from pathlib import Path
      def yaml_quote(value: str) -> str:
          return "'" + value.replace("'", "''") + "'"
      Path('/tmp/provision-vars.yml').write_text(
          f"bootstrap_user: {yaml_quote(os.environ['ANSIBLE_USER'])}\n"
          f"semaphore_agent_authorized_key: {yaml_quote(os.environ['SEMAPHORE_AGENT_AUTHORIZED_KEY'])}\n"
      )
      PY
  script:
    - ansible-playbook -i inventory/hosts.yml playbooks/lifecycle/10-provision.yml --limit "$RESOLVED_TARGETS" -e @/tmp/provision-vars.yml

ansible-apply-lifecycle:
  <<: *default_ssh_ansible_job
  <<: *rules_manual_apply
  stage: apply
  before_script:
    - source .ci/ci_prepare_ssh.sh LIFECYCLE_TARGETS
    - |
      if [ "${DOCKER_REGISTRY_AUTH_ENABLED:-}" = "true" ]; then
        test -n "${DOCKER_REGISTRY_AUTH_REGISTRY:-}" || (echo "DOCKER_REGISTRY_AUTH_REGISTRY is required when DOCKER_REGISTRY_AUTH_ENABLED=true" && exit 1)
        test -n "${DOCKER_REGISTRY_AUTH_USERNAME:-}" || (echo "DOCKER_REGISTRY_AUTH_USERNAME is required when DOCKER_REGISTRY_AUTH_ENABLED=true" && exit 1)
        test -n "${DOCKER_REGISTRY_AUTH_PASSWORD:-}" || (echo "DOCKER_REGISTRY_AUTH_PASSWORD is required when DOCKER_REGISTRY_AUTH_ENABLED=true" && exit 1)
        python3 -c 'import json, os, pathlib; pathlib.Path("/tmp/docker-registry-auth-vars.json").write_text(json.dumps({"docker_registry_auth_enabled": True, "docker_registry_auth_entries": [{"registry": os.environ["DOCKER_REGISTRY_AUTH_REGISTRY"], "username": os.environ["DOCKER_REGISTRY_AUTH_USERNAME"], "password": os.environ["DOCKER_REGISTRY_AUTH_PASSWORD"]}]}, indent=2))'
      else
        printf '%s\n' '{"docker_registry_auth_enabled": false}' > /tmp/docker-registry-auth-vars.json
      fi
  script:
    - ansible-playbook -i inventory/hosts.yml site.yml --limit "$LIFECYCLE_TARGETS" -e @/tmp/docker-registry-auth-vars.json

ansible-apply-updates:
  <<: *default_ssh_ansible_job
  <<: *rules_update
  stage: apply
  before_script:
    - source .ci/ci_prepare_ssh.sh UPDATE_TARGETS
  script:
    - printf 'UPDATE_TARGETS=%s\n' "$UPDATE_TARGETS"
    - printf 'Resolved target names:\n'
    - cat /tmp/ansible_target_names.txt
    - printf 'Resolved ansible_host values:\n'
    - cat /tmp/ansible_hosts.txt
    - ANSIBLE_FORCE_COLOR=1 PY_COLORS=1 ansible-playbook -i inventory/hosts.yml playbooks/lifecycle/30-apt-upgrade.yml --limit "$UPDATE_TARGETS" -vvv