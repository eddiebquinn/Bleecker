          print(host)
      PY
    - test -s /tmp/ansible_hosts.txt || (echo "No ansible_host entries found for LIFECYCLE_TARGETS=$LIFECYCLE_TARGETS" && exit 1)
    - xargs -r -n 1 ssh-keyscan -H -t ed25519,rsa < /tmp/ansible_hosts.txt > .ansible/known_hosts
    - chmod 644 .ansible/known_hosts
  script:
    - ansible-playbook -i inventory/hosts.yml site.yml --limit "$LIFECYCLE_TARGETS" --user "$ANSIBLE_USER" --private-key ~/.ssh/ci_ansible_key

ansible-apply-updates:
  <<: *default_ssh_ansible_job
  <<: *rules_update
  stage: update
  needs:
    - job: ansible-validate
  before_script:
    - apt-get update
    - apt-get install -y openssh-client
    - python -m pip install --upgrade pip
    - pip install ansible
    - test -n "$UPDATE_TARGETS" || (echo "UPDATE_TARGETS is required" && exit 1)
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is required" && exit 1)
    - test -n "$ANSIBLE_USER" || (echo "ANSIBLE_USER is required" && exit 1)
