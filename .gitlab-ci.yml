    - chmod 644 .ansible/known_hosts
  script:
    - ansible-playbook -i inventory/hosts.yml site.yml --limit "$LIFECYCLE_TARGETS" --user "$ANSIBLE_USER" --private-key ~/.ssh/ci_ansible_key

ansible-apply-updates:
  <<: *default_ssh_ansible_job
  <<: *rules_update
  stage: apply
  needs:
    - job: ansible-validate
  before_script:
    - apt-get update
    - apt-get install -y openssh-client
    - python -m pip install --upgrade pip
    - pip install ansible
    - test -n "$UPDATE_TARGETS" || (echo "UPDATE_TARGETS is required" && exit 1)
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is required" && exit 1)
    - test -n "$ANSIBLE_USER" || (echo "ANSIBLE_USER is required" && exit 1)
    - mkdir -p ~/.ssh .ansible
    - chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ci_ansible_key
    - chmod 600 ~/.ssh/ci_ansible_key
    - ansible -i inventory/hosts.yml "$UPDATE_TARGETS" --list-hosts | tail -n +2 | tr -d ' ' > /tmp/ansible_target_names.txt
    - test -s /tmp/ansible_target_names.txt || (echo "No hosts matched UPDATE_TARGETS=$UPDATE_TARGETS" && exit 1)
    - |
      python3 - <<'PY' > /tmp/ansible_hosts.txt
      import yaml
      from pathlib import Path
      data = yaml.safe_load(Path('inventory/hosts.yml').read_text())
      targets = {line.strip() for line in Path('/tmp/ansible_target_names.txt').read_text().splitlines() if line.strip()}
