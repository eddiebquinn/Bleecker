docker_agent_user_enabled: true

docker_agent_name: docker-agent
docker_agent_uid: 1101
docker_agent_gid: 1101
docker_agent_home: /var/lib/docker-agent
docker_agent_shell: /usr/sbin/nologin

docker_service_name: docker

deploy_root: "/etc/komodo"
ssh_root: "{{ deploy_root }}/ssh"
compose_repo_root: "{{ deploy_root }}/repos"
compose_git_base_url: "ssh://git@gitlab-ssh.eddiequinn.casa:2424/compose-files"
infisical_domain: "https://infisical.eddiequinn.casa/api"

# Komodo Vars

# Monitoring stack vars

# Docker package management is enabled so fresh Docker hosts can bootstrap cleanly
docker_manage_packages: true

# Docker registry mirrors for local caching proxies (infstack-1)
# All docker_hosts pull through the LAN caches except pangolin-1 (VPS).
docker_daemon_config:
  registry-mirrors:
    - "http://cache-proxies.infra.local.eddiequinn.casa:5000"
    - "http://cache-proxies.infra.local.eddiequinn.casa:5001"
  # Container DNS: docker's embedded resolver (127.0.0.11) fails to forward
  # on docker hosts (breakage dating ~Jul 2026 — forced RPZ disable in
  # bind9 e79d6557, and every bind9 deploy build failure since Aug 27).
  # Pin the embedded DNS upstream to infstack-1's bind9 so runtime
  # containers and build sandboxes resolve via the LAN resolver instead
  # of the broken host-resolv.conf copy. Intentionally single resolver —
  # OPNsense Unbound (10.67.45.1) deliberately NOT used as a fallback.
  dns:
    - "10.67.40.25"

