---
# Network configuration — triggers ansible-network-dry-run via rules:changes
- name: Configure RouterOS switches
  hosts: routeros_switches
  gather_facts: no
  roles:
    - role: routeros_l3_switch

- name: Configure OPNsense firewalls
  hosts: opnsense_firewalls
  gather_facts: no
  roles:
    - role: opnsense_firewall
