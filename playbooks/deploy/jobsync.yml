---
- name: Sync JobSync repo to selected docker hosts
  hosts: "{{ jobsync_deploy_targets | default('jobsync_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert JobSync deploy targets were provided
      ansible.builtin.assert:
        that:
          - jobsync_deploy_targets is defined
          - jobsync_deploy_targets | length > 0
        fail_msg: >-
          JobSync deploy requires jobsync_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync JobSync repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "JobSync"
        compose_app_name: "jobsync"
        compose_repo_deploy_key_private: "{{ jobsync_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ jobsync_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_JOBSYNC_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ jobsync_infisical_project_id }}"
        compose_repo_infisical_token: "{{ jobsync_infisical_token }}"
      tags: [sync, core]

- name: Deploy JobSync to selected docker hosts
  hosts: "{{ jobsync_deploy_targets | default('jobsync_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert JobSync deploy targets were provided
      ansible.builtin.assert:
        that:
          - jobsync_deploy_targets is defined
          - jobsync_deploy_targets | length > 0
        fail_msg: >-
          JobSync deploy requires jobsync_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run JobSync deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "JobSync"
        compose_app_name: "jobsync"
      tags: [core]
