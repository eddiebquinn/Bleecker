---
- name: Sync Omada repo to selected docker hosts
  hosts: "{{ omada_deploy_targets | default('omada_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Omada deploy targets were provided
      ansible.builtin.assert:
        that:
          - omada_deploy_targets is defined
          - omada_deploy_targets | length > 0
        fail_msg: >-
          Omada deploy requires omada_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Omada repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Omada"
        compose_app_name: "omada"
        compose_repo_deploy_key_private: "{{ omada_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ omada_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy Omada to selected docker hosts
  hosts: "{{ omada_deploy_targets | default('omada_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Omada deploy targets were provided
      ansible.builtin.assert:
        that:
          - omada_deploy_targets is defined
          - omada_deploy_targets | length > 0
        fail_msg: >-
          Omada deploy requires omada_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Omada deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Omada"
        compose_app_name: "omada"
      tags: [core]
