---
- name: Sync DBackup repo to selected docker hosts
  hosts: "{{ dbackup_deploy_targets | default('dbackup_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert DBackup deploy targets were provided
      ansible.builtin.assert:
        that:
          - dbackup_deploy_targets is defined
          - dbackup_deploy_targets | length > 0
        fail_msg: >-
          DBackup deploy requires dbackup_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync DBackup repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "DBackup"
        compose_app_name: "dbackup"
        compose_repo_deploy_key_private: "{{ dbackup_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ dbackup_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_HOMEPAGE_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ dbackup_infisical_project_id }}"
        compose_repo_infisical_token: "{{ dbackup_infisical_token }}"
      tags: [sync, core]

- name: Deploy DBackup to selected docker hosts
  hosts: "{{ dbackup_deploy_targets | default('dbackup_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert DBackup deploy targets were provided
      ansible.builtin.assert:
        that:
          - dbackup_deploy_targets is defined
          - dbackup_deploy_targets | length > 0
        fail_msg: >-
          DBackup deploy requires dbackup_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run DBackup deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "DBackup"
        compose_app_name: "dbackup"
      tags: [core]
