---
- name: Sync Komodo repo to docker hosts
  hosts: docker_hosts
  become: true
  gather_facts: true
  tasks:
    - name: Sync repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Komodo"
        compose_repo_url: "{{ komodo_repo_url }}"
        compose_repo_dest: "{{ komodo_repo_dest }}"
        compose_repo_branch: "{{ komodo_repo_branch }}"
        compose_deploy_script: "{{ komodo_deploy_script }}"
        compose_repo_ssh_dir: "{{ komodo_repo_ssh_dir }}"
        compose_repo_ssh_key_path: "{{ komodo_repo_ssh_key_path }}"
        compose_repo_known_hosts_path: "{{ komodo_repo_known_hosts_path }}"
        compose_repo_deploy_key_private: "{{ komodo_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ komodo_git_known_hosts }}"
      tags: [sync, core, periphery]

- name: Deploy Komodo Core
  hosts: docker_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Run Komodo core deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Komodo"
        compose_repo_dest: "{{ komodo_repo_dest }}"
        compose_deploy_script: "{{ komodo_deploy_script }}"
        compose_deploy_args:
          - --core
      when: (komodo_core | default(false)) | bool
      tags: [core]

- name: Deploy Komodo Periphery
  hosts: docker_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Run Komodo periphery deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Komodo"
        compose_repo_dest: "{{ komodo_repo_dest }}"
        compose_deploy_script: "{{ komodo_deploy_script }}"
        compose_deploy_args:
          - --periphery
      tags: [periphery]
