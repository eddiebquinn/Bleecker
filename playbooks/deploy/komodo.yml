---
- name: Sync Komodo repo to selected docker hosts
  hosts: "{{ [komodo_core_deploy_targets | default(''), komodo_periphery_deploy_targets | default('')] | reject('equalto', '') | join(':') if (komodo_core_deploy_targets is defined and komodo_periphery_deploy_targets is defined) else 'komodo_targets_missing' }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Komodo sync targets were provided
      ansible.builtin.assert:
        that:
          - komodo_core_deploy_targets is defined
          - komodo_core_deploy_targets | length > 0
          - komodo_periphery_deploy_targets is defined
          - komodo_periphery_deploy_targets | length > 0
        fail_msg: >-
          Komodo deploy requires both komodo_core_deploy_targets and
          komodo_periphery_deploy_targets so sync can cover every target host.
      changed_when: false

    - name: Sync repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Komodo"
        compose_app_name: "komodo"
        compose_repo_deploy_key_private: "{{ komodo_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ komodo_git_known_hosts }}"
      tags: [sync, core, periphery]

- name: Deploy Komodo Core
  hosts: "{{ komodo_core_deploy_targets | default('komodo_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Komodo core deploy targets were provided
      ansible.builtin.assert:
        that:
          - komodo_core_deploy_targets is defined
          - komodo_core_deploy_targets | length > 0
        fail_msg: >-
          Komodo core deploy requires komodo_core_deploy_targets.
          Pass it from CI to choose the core target host(s).
      changed_when: false

    - name: Run Komodo core deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Komodo"
        compose_app_name: "komodo"
        compose_deploy_args:
          - --core
      tags: [core]

- name: Deploy Komodo Periphery
  hosts: "{{ komodo_periphery_deploy_targets | default('komodo_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Komodo periphery deploy targets were provided
      ansible.builtin.assert:
        that:
          - komodo_periphery_deploy_targets is defined
          - komodo_periphery_deploy_targets | length > 0
        fail_msg: >-
          Komodo periphery deploy requires komodo_periphery_deploy_targets.
          Pass it from CI to choose the periphery target host(s).
      changed_when: false

    - name: Run Komodo periphery deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Komodo"
        compose_app_name: "komodo"
        compose_deploy_args:
          - --periphery
      tags: [periphery]
