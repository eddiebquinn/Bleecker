---
- name: Sync Bind9 repo to selected docker hosts
  hosts: "{{ bind9_deploy_targets | default('bind9_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Bind9 deploy targets were provided
      ansible.builtin.assert:
        that:
          - bind9_deploy_targets is defined
          - bind9_deploy_targets | length > 0
        fail_msg: >-
          Bind9 deploy requires bind9_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Bind9 repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Bind9"
        compose_app_name: "bind9"
        compose_repo_deploy_key_private: "{{ bind9_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ bind9_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy Bind9 to selected docker hosts
  hosts: "{{ bind9_deploy_targets | default('bind9_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Bind9 deploy targets were provided
      ansible.builtin.assert:
        that:
          - bind9_deploy_targets is defined
          - bind9_deploy_targets | length > 0
        fail_msg: >-
          Bind9 deploy requires bind9_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Bind9 deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Bind9"
        compose_app_name: "bind9"
      tags: [core]
