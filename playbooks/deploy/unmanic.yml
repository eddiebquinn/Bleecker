---
- name: Sync Unmanic repo to selected docker hosts
  hosts: "{{ unmanic_deploy_targets | default('unmanic_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Unmanic deploy targets were provided
      ansible.builtin.assert:
        that:
          - unmanic_deploy_targets is defined
          - unmanic_deploy_targets | length > 0
        fail_msg: >-
          Unmanic deploy requires unmanic_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Unmanic repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Unmanic"
        compose_app_name: "unmanic"
        compose_repo_deploy_key_private: "{{ unmanic_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ unmanic_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy Unmanic to selected docker hosts
  hosts: "{{ unmanic_deploy_targets | default('unmanic_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Unmanic deploy targets were provided
      ansible.builtin.assert:
        that:
          - unmanic_deploy_targets is defined
          - unmanic_deploy_targets | length > 0
        fail_msg: >-
          Unmanic deploy requires unmanic_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Unmanic deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Unmanic"
        compose_app_name: "unmanic"
      tags: [core]
