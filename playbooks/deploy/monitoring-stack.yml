---
- name: Sync monitoring stack repo to selected docker hosts
  hosts: "{{ [monitoring_core_deploy_targets | default(''), monitoring_exporter_deploy_targets | default('')] | reject('equalto', '') | join(':') if (monitoring_core_deploy_targets is defined and monitoring_exporter_deploy_targets is defined) else 'monitoring_targets_missing' }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert monitoring sync targets were provided
      ansible.builtin.assert:
        that:
          - monitoring_core_deploy_targets is defined
          - monitoring_core_deploy_targets | length > 0
          - monitoring_exporter_deploy_targets is defined
          - monitoring_exporter_deploy_targets | length > 0
        fail_msg: >-
          Monitoring deploy requires both monitoring_core_deploy_targets and
          monitoring_exporter_deploy_targets so sync can cover every target host.
      changed_when: false

    - name: Sync monitoring stack repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Monitoring stack"
        compose_app_name: "monitoring-stack"
        compose_repo_deploy_key_private: "{{ monitoring_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ monitoring_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_MONITORING_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ monitoring_infisical_project_id }}"
        compose_repo_infisical_token: "{{ monitoring_infisical_token }}"
        compose_repo_env_exports:
          - path: core/.env
            path_in_infisical: /monitoring-stack/application
            tags:
              - core
      tags: [sync, core, exporters]

- name: Deploy monitoring core to designated hosts
  hosts: "{{ monitoring_core_deploy_targets | default('monitoring_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert monitoring core deploy targets were provided
      ansible.builtin.assert:
        that:
          - monitoring_core_deploy_targets is defined
          - monitoring_core_deploy_targets | length > 0
        fail_msg: >-
          Monitoring core deploy requires monitoring_core_deploy_targets.
          Pass it from CI to choose the core target host(s).
      changed_when: false

    - name: Run monitoring core deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Monitoring stack"
        compose_app_name: "monitoring-stack"
        compose_deploy_args:
          - --core
      tags: [core]

- name: Deploy monitoring exporters to designated hosts
  hosts: "{{ monitoring_exporter_deploy_targets | default('monitoring_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert monitoring exporter deploy targets were provided
      ansible.builtin.assert:
        that:
          - monitoring_exporter_deploy_targets is defined
          - monitoring_exporter_deploy_targets | length > 0
        fail_msg: >-
          Monitoring exporter deploy requires monitoring_exporter_deploy_targets.
          Pass it from CI to choose the exporter target host(s).
      changed_when: false

    - name: Run monitoring exporter deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Monitoring stack"
        compose_app_name: "monitoring-stack"
        compose_deploy_args:
          - --exporters
      tags: [exporters]
