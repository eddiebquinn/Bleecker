---
- name: Sync Authentik repo to selected docker hosts
  hosts: "{{ authentik_deploy_targets | default('authentik_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Authentik deploy targets were provided
      ansible.builtin.assert:
        that:
          - authentik_deploy_targets is defined
          - authentik_deploy_targets | length > 0
        fail_msg: >-
          Authentik deploy requires authentik_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Authentik repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Authentik"
        compose_app_name: "authentik"
        compose_repo_deploy_key_private: "{{ authentik_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ authentik_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_AUTHENTIK_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ authentik_infisical_project_id }}"
        compose_repo_infisical_token: "{{ authentik_infisical_token }}"
      tags: [sync, core]

- name: Deploy Authentik to selected docker hosts
  hosts: "{{ authentik_deploy_targets | default('authentik_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Authentik deploy targets were provided
      ansible.builtin.assert:
        that:
          - authentik_deploy_targets is defined
          - authentik_deploy_targets | length > 0
        fail_msg: >-
          Authentik deploy requires authentik_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Authentik deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Authentik"
        compose_app_name: "authentik"
      tags: [core]
