---
- name: Sync KASM repo to selected docker hosts
  hosts: "{{ kasm_deploy_targets | default('kasm_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert KASM deploy targets were provided
      ansible.builtin.assert:
        that:
          - kasm_deploy_targets is defined
          - kasm_deploy_targets | length > 0
        fail_msg: >-
          KASM deploy requires kasm_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync KASM repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "KASM"
        compose_app_name: "kasm"
        compose_repo_deploy_key_private: "{{ kasm_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ kasm_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy KASM to selected docker hosts
  hosts: "{{ kasm_deploy_targets | default('kasm_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert KASM deploy targets were provided
      ansible.builtin.assert:
        that:
          - kasm_deploy_targets is defined
          - kasm_deploy_targets | length > 0
        fail_msg: >-
          KASM deploy requires kasm_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run KASM deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "KASM"
        compose_app_name: "kasm"
      tags: [core]
