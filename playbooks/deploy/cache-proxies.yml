---
- name: Sync Cache Proxies repo to selected docker hosts
  hosts: "{{ cache_proxies_deploy_targets | default('cache_proxies_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Cache Proxies deploy targets were provided
      ansible.builtin.assert:
        that:
          - cache_proxies_deploy_targets is defined
          - cache_proxies_deploy_targets | length > 0
        fail_msg: >-
          Cache Proxies deploy requires cache_proxies_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Cache Proxies repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Cache Proxies"
        compose_app_name: "cache-proxies"
        compose_repo_deploy_key_private: "{{ cache_proxies_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ cache_proxies_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: false
      tags: [sync, core]

- name: Deploy Cache Proxies to selected docker hosts
  hosts: "{{ cache_proxies_deploy_targets | default('cache_proxies_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Cache Proxies deploy targets were provided
      ansible.builtin.assert:
        that:
          - cache_proxies_deploy_targets is defined
          - cache_proxies_deploy_targets | length > 0
        fail_msg: >-
          Cache Proxies deploy requires cache_proxies_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Cache Proxies deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Cache Proxies"
        compose_app_name: "cache-proxies"
      tags: [core]
