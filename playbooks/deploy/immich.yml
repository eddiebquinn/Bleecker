---
- name: Sync Immich repo to selected docker hosts
  hosts: "{{ immich_deploy_targets | default('immich_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Immich deploy targets were provided
      ansible.builtin.assert:
        that:
          - immich_deploy_targets is defined
          - immich_deploy_targets | length > 0
        fail_msg: >-
          Immich deploy requires immich_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Immich repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Immich"
        compose_app_name: "immich"
        compose_repo_deploy_key_private: "{{ immich_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ immich_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_IMMICH_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ immich_infisical_project_id }}"
        compose_repo_infisical_token: "{{ immich_infisical_token }}"
      tags: [sync, core]

- name: Deploy Immich to selected docker hosts
  hosts: "{{ immich_deploy_targets | default('immich_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Immich deploy targets were provided
      ansible.builtin.assert:
        that:
          - immich_deploy_targets is defined
          - immich_deploy_targets | length > 0
        fail_msg: >-
          Immich deploy requires immich_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Immich deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Immich"
        compose_app_name: "immich"
      tags: [core]
