---
- name: Sync Cloudflare Utils repo to selected docker hosts
  hosts: "{{ cloudflare_utils_deploy_targets | default('cloudflare_utils_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Cloudflare Utils deploy targets were provided
      ansible.builtin.assert:
        that:
          - cloudflare_utils_deploy_targets is defined
          - cloudflare_utils_deploy_targets | length > 0
        fail_msg: >-
          Cloudflare Utils deploy requires cloudflare_utils_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Cloudflare Utils repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Cloudflare Utils"
        compose_repo_url: "{{ cloudflare_utils_repo_url }}"
        compose_repo_branch: "{{ (lookup('ansible.builtin.env', 'DEPLOYMENT_CLOUDFLARE_UTILS_REPO_BRANCH', default='') | trim) or cloudflare_utils_repo_branch }}"
        compose_deploy_script: "{{ cloudflare_utils_deploy_script }}"
        compose_repo_ssh_dir: "{{ cloudflare_utils_repo_ssh_dir }}"
        compose_repo_ssh_key_path: "{{ cloudflare_utils_repo_ssh_key_path }}"
        compose_repo_known_hosts_path: "{{ cloudflare_utils_repo_known_hosts_path }}"
        compose_repo_deploy_key_private: "{{ cloudflare_utils_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ cloudflare_utils_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: "{{ cloudflare_utils_infisical_application_sync_enabled }}"
        compose_repo_infisical_project_id: "{{ cloudflare_utils_infisical_project_id }}"
        compose_repo_infisical_env: "{{ cloudflare_utils_infisical_env }}"
        compose_repo_infisical_token: "{{ cloudflare_utils_infisical_token }}"
        compose_repo_infisical_domain: "{{ cloudflare_utils_infisical_domain }}"
        compose_repo_env_exports:
          - path: ".env"
            path_in_infisical: "{{ cloudflare_utils_infisical_application_path }}"
      tags: [sync, core]

    - name: Check exported Cloudflare Utils env file
      ansible.builtin.stat:
        path: "{{ compose_repo_root }}/{{ cloudflare_utils_repo_url | basename | regex_replace('\\.git$', '') }}/.env"
      register: cloudflare_utils_env_file
      changed_when: false

    - name: Assert Cloudflare Utils env file is not empty
      ansible.builtin.assert:
        that:
          - cloudflare_utils_env_file.stat.exists
          - (cloudflare_utils_env_file.stat.size | int) > 0
        fail_msg: >-
          Cloudflare Utils exported .env is missing or empty at {{ compose_repo_root }}/{{ cloudflare_utils_repo_url | basename | regex_replace('\\.git$', '') }}/.env.
          Check the Infisical path/tags/env for cloudflare-utils application secrets.
      changed_when: false

- name: Deploy Cloudflare Utils to selected docker hosts
  hosts: "{{ cloudflare_utils_deploy_targets | default('cloudflare_utils_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Cloudflare Utils deploy targets were provided
      ansible.builtin.assert:
        that:
          - cloudflare_utils_deploy_targets is defined
          - cloudflare_utils_deploy_targets | length > 0
        fail_msg: >-
          Cloudflare Utils deploy requires cloudflare_utils_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Cloudflare Utils deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Cloudflare Utils"
        compose_repo_url: "{{ cloudflare_utils_repo_url }}"
        compose_deploy_script: "{{ cloudflare_utils_deploy_script }}"
      tags: [core]
