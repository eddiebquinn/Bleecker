---
- name: Sync Syncthing repo to selected docker hosts
  hosts: "{{ syncthing_deploy_targets | default('syncthing_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Syncthing deploy targets were provided
      ansible.builtin.assert:
        that:
          - syncthing_deploy_targets is defined
          - syncthing_deploy_targets | length > 0
        fail_msg: >-
          Syncthing deploy requires syncthing_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Syncthing repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Syncthing"
        compose_app_name: "syncthing"
        compose_repo_deploy_key_private: "{{ syncthing_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ syncthing_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy Syncthing to selected docker hosts
  hosts: "{{ syncthing_deploy_targets | default('syncthing_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Syncthing deploy targets were provided
      ansible.builtin.assert:
        that:
          - syncthing_deploy_targets is defined
          - syncthing_deploy_targets | length > 0
        fail_msg: >-
          Syncthing deploy requires syncthing_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Syncthing deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Syncthing"
        compose_app_name: "syncthing"
      tags: [core]
