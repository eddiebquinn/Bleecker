---
- name: Sync Renovate repo to selected docker hosts
  hosts: "{{ renovate_deploy_targets | default('renovate_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Renovate deploy targets were provided
      ansible.builtin.assert:
        that:
          - renovate_deploy_targets is defined
          - renovate_deploy_targets | length > 0
        fail_msg: >-
          Renovate deploy requires renovate_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Renovate repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Renovate"
        compose_repo_url: "{{ renovate_repo_url }}"
        compose_app_name: "renovate"
        compose_repo_branch: "{{ (lookup('ansible.builtin.env', 'DEPLOYMENT_RENOVATE_REPO_BRANCH', default='') | trim) or renovate_repo_branch }}"
        compose_deploy_script: "{{ renovate_deploy_script }}"
        compose_repo_deploy_key_private: "{{ renovate_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ renovate_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: "{{ renovate_infisical_application_sync_enabled }}"
        compose_repo_infisical_project_id: "{{ renovate_infisical_project_id }}"
        compose_repo_infisical_env: "{{ renovate_infisical_env }}"
        compose_repo_infisical_token: "{{ renovate_infisical_token }}"
        compose_repo_infisical_domain: "{{ renovate_infisical_domain }}"
        compose_repo_env_exports:
          - path: ".env"
            path_in_infisical: "{{ renovate_infisical_application_path }}"
      tags: [sync, core]

    - name: Check exported Renovate env file
      ansible.builtin.stat:
        path: "{{ compose_repo_root }}/{{ renovate_repo_url | basename | regex_replace('\\.git$', '') }}/.env"
      register: renovate_env_file
      changed_when: false

    - name: Assert Renovate env file is not empty
      ansible.builtin.assert:
        that:
          - renovate_env_file.stat.exists
          - (renovate_env_file.stat.size | int) > 0
        fail_msg: >-
          Renovate exported .env is missing or empty at {{ compose_repo_root }}/{{ renovate_repo_url | basename | regex_replace('\\.git$', '') }}/.env.
          Check the Infisical path/tags/env for renovate application secrets.
      changed_when: false

- name: Deploy Renovate to selected docker hosts
  hosts: "{{ renovate_deploy_targets | default('renovate_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Renovate deploy targets were provided
      ansible.builtin.assert:
        that:
          - renovate_deploy_targets is defined
          - renovate_deploy_targets | length > 0
        fail_msg: >-
          Renovate deploy requires renovate_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Renovate deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Renovate"
        compose_repo_url: "{{ renovate_repo_url }}"
        compose_app_name: "renovate"
        compose_deploy_script: "{{ renovate_deploy_script }}"
      tags: [core]
