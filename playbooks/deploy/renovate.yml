---
- name: Sync Renovate repo to selected docker hosts
  hosts: "{{ renovate_deploy_targets | default('renovate_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Renovate deploy targets were provided
      ansible.builtin.assert:
        that:
          - renovate_deploy_targets is defined
          - renovate_deploy_targets | length > 0
        fail_msg: >-
          Renovate deploy requires renovate_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Renovate repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Renovate"
        compose_app_name: "renovate"
        compose_repo_deploy_key_private: "{{ renovate_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ renovate_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: "{{ renovate_infisical_application_sync_enabled }}"
        compose_repo_infisical_project_id: "{{ renovate_infisical_project_id }}"
        compose_repo_infisical_token: "{{ renovate_infisical_token }}"
      tags: [sync, core]


- name: Deploy Renovate to selected docker hosts
  hosts: "{{ renovate_deploy_targets | default('renovate_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Renovate deploy targets were provided
      ansible.builtin.assert:
        that:
          - renovate_deploy_targets is defined
          - renovate_deploy_targets | length > 0
        fail_msg: >-
          Renovate deploy requires renovate_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Renovate deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Renovate"
        compose_app_name: "renovate"
      tags: [core]
