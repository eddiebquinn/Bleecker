---
- name: Sync Synapse repo to selected docker hosts
  hosts: "{{ synapse_deploy_targets | default('synapse_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Synapse deploy targets were provided
      ansible.builtin.assert:
        that:
          - synapse_deploy_targets is defined
          - synapse_deploy_targets | length > 0
        fail_msg: >-
          Synapse deploy requires synapse_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Synapse repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Synapse"
        compose_app_name: "synapse"
        compose_repo_deploy_key_private: "{{ synapse_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ synapse_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_SYNAPSE_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ synapse_infisical_project_id }}"
        compose_repo_infisical_token: "{{ synapse_infisical_token }}"
      tags: [sync, core]

- name: Deploy Synapse to selected docker hosts
  hosts: "{{ synapse_deploy_targets | default('synapse_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Synapse deploy targets were provided
      ansible.builtin.assert:
        that:
          - synapse_deploy_targets is defined
          - synapse_deploy_targets | length > 0
        fail_msg: >-
          Synapse deploy requires synapse_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Synapse deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Synapse"
        compose_app_name: "synapse"
      tags: [core]
