---
- name: Sync Omnisearch repo to selected docker hosts
  hosts: "{{ omnisearch_deploy_targets | default('omnisearch_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Omnisearch deploy targets were provided
      ansible.builtin.assert:
        that:
          - omnisearch_deploy_targets is defined
          - omnisearch_deploy_targets | length > 0
        fail_msg: >-
          Omnisearch deploy requires omnisearch_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Omnisearch repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Omnisearch"
        compose_app_name: "omnisearch"
        compose_repo_deploy_key_private: "{{ omnisearch_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ omnisearch_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy Omnisearch to selected docker hosts
  hosts: "{{ omnisearch_deploy_targets | default('omnisearch_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Omnisearch deploy targets were provided
      ansible.builtin.assert:
        that:
          - omnisearch_deploy_targets is defined
          - omnisearch_deploy_targets | length > 0
        fail_msg: >-
          Omnisearch deploy requires omnisearch_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Omnisearch deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Omnisearch"
        compose_app_name: "omnisearch"
      tags: [core]
