---
- name: Sync Scrutiny repo to selected docker hosts
  hosts: "{{ scrutiny_deploy_targets | default('scrutiny_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Scrutiny deploy targets were provided
      ansible.builtin.assert:
        that:
          - scrutiny_deploy_targets is defined
          - scrutiny_deploy_targets | length > 0
        fail_msg: >-
          Scrutiny deploy requires scrutiny_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Scrutiny repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Scrutiny"
        compose_app_name: "scrutiny"
        compose_repo_deploy_key_private: "{{ scrutiny_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ scrutiny_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_SCRUTINY_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ scrutiny_infisical_project_id }}"
        compose_repo_infisical_token: "{{ scrutiny_infisical_token }}"
      tags: [sync, core]

- name: Deploy Scrutiny to selected docker hosts
  hosts: "{{ scrutiny_deploy_targets | default('scrutiny_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Scrutiny deploy targets were provided
      ansible.builtin.assert:
        that:
          - scrutiny_deploy_targets is defined
          - scrutiny_deploy_targets | length > 0
        fail_msg: >-
          Scrutiny deploy requires scrutiny_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Scrutiny deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Scrutiny"
        compose_app_name: "scrutiny"
      tags: [core]
