---
- name: Sync Homepage repo to selected docker hosts
  hosts: "{{ homepage_deploy_targets | default('homepage_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Homepage deploy targets were provided
      ansible.builtin.assert:
        that:
          - homepage_deploy_targets is defined
          - homepage_deploy_targets | length > 0
        fail_msg: >-
          Homepage deploy requires homepage_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Homepage repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Homepage"
        compose_app_name: "homepage"
        compose_repo_deploy_key_private: "{{ homepage_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ homepage_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_HOMEPAGE_UTILS_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ homepage_utils_infisical_project_id }}"
        compose_repo_infisical_token: "{{ homepage_utils_infisical_token }}"
      tags: [sync, core]

- name: Deploy Homepage to selected docker hosts
  hosts: "{{ homepage_deploy_targets | default('homepage_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Homepage deploy targets were provided
      ansible.builtin.assert:
        that:
          - homepage_deploy_targets is defined
          - homepage_deploy_targets | length > 0
        fail_msg: >-
          Homepage deploy requires homepage_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Homepage deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Homepage"
        compose_app_name: "homepage"
      tags: [core]
