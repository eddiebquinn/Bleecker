---
- name: Sync ntfy repo to selected docker hosts
  hosts: "{{ ntfy_deploy_targets | default('ntfy_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert ntfy deploy targets were provided
      ansible.builtin.assert:
        that:
          - ntfy_deploy_targets is defined
          - ntfy_deploy_targets | length > 0
        fail_msg: >-
          ntfy deploy requires ntfy_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync ntfy repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "ntfy"
        compose_app_name: "ntfy"
        compose_repo_deploy_key_private: "{{ ntfy_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ ntfy_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy ntfy to selected docker hosts
  hosts: "{{ ntfy_deploy_targets | default('ntfy_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert ntfy deploy targets were provided
      ansible.builtin.assert:
        that:
          - ntfy_deploy_targets is defined
          - ntfy_deploy_targets | length > 0
        fail_msg: >-
          ntfy deploy requires ntfy_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run ntfy deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "ntfy"
        compose_app_name: "ntfy"
      tags: [core]
