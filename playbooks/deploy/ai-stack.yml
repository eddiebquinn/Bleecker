---
- name: Sync AI Stack repo to selected docker hosts
  hosts: "{{ ai_stack_deploy_targets | default('ai_stack_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert AI Stack deploy targets were provided
      ansible.builtin.assert:
        that:
          - ai_stack_deploy_targets is defined
          - ai_stack_deploy_targets | length > 0
        fail_msg: >-
          AI Stack deploy requires ai_stack_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync AI Stack repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "AI Stack"
        compose_app_name: "ai-stack"
        compose_repo_deploy_key_private: "{{ ai_stack_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ ai_stack_git_known_hosts }}"
      tags: [sync, core]

- name: Deploy AI Stack to selected docker hosts
  hosts: "{{ ai_stack_deploy_targets | default('ai_stack_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert AI Stack deploy targets were provided
      ansible.builtin.assert:
        that:
          - ai_stack_deploy_targets is defined
          - ai_stack_deploy_targets | length > 0
        fail_msg: >-
          AI Stack deploy requires ai_stack_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run AI Stack deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "AI Stack"
        compose_app_name: "ai-stack"
      tags: [core]
