---
- name: Sync Arr Stack repo to selected docker hosts
  hosts: "{{ arr_stack_deploy_targets | default('arr_stack_targets_missing') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Assert Arr Stack deploy targets were provided
      ansible.builtin.assert:
        that:
          - arr_stack_deploy_targets is defined
          - arr_stack_deploy_targets | length > 0
        fail_msg: >-
          Arr Stack deploy requires arr_stack_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Sync Arr Stack repo
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: sync
      vars:
        compose_repo_label: "Arr Stack"
        compose_app_name: "arr-stack"
        compose_repo_deploy_key_private: "{{ arr_stack_repo_deploy_key_private }}"
        compose_git_known_hosts: "{{ arr_stack_git_known_hosts }}"
        compose_repo_infisical_application_sync_enabled: >-
          {{ (lookup('ansible.builtin.env', 'DEPLOYMENT_ARR_STACK_INFISICAL_SYNC_ENABLED', default='true') | trim | lower) in ['1', 'true', 'yes', 'on'] }}
        compose_repo_infisical_project_id: "{{ arr_stack_infisical_project_id }}"
        compose_repo_infisical_token: "{{ arr_stack_infisical_token }}"
        compose_repo_env_exports:
          - path: .env
            path_in_infisical: /arr-stack/application
      tags: [sync, core]

- name: Deploy Arr Stack to selected docker hosts
  hosts: "{{ arr_stack_deploy_targets | default('arr_stack_targets_missing') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Assert Arr Stack deploy targets were provided
      ansible.builtin.assert:
        that:
          - arr_stack_deploy_targets is defined
          - arr_stack_deploy_targets | length > 0
        fail_msg: >-
          Arr Stack deploy requires arr_stack_deploy_targets.
          Pass it from CI to choose the target host(s) explicitly.
      changed_when: false

    - name: Run Arr Stack deployment
      ansible.builtin.include_role:
        name: compose_repo_deploy
        tasks_from: run
      vars:
        compose_repo_label: "Arr Stack"
        compose_app_name: "arr-stack"
      tags: [core]
