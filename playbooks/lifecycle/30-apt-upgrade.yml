---
- name: Upgrade Debian/Ubuntu hosts and reboot if required
  hosts: all:!core_infra
  gather_facts: true
  become: true

  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a

  tasks:
    - name: Capture dist-upgrade start timestamp
      ansible.builtin.command:
        argv:
          - date
          - +%s
      register: dist_upgrade_started_epoch
      changed_when: false
      when: ansible_facts.os_family == "Debian"

    - name: Log dist-upgrade start timestamp
      ansible.builtin.debug:
        msg: "dist-upgrade start inventory_hostname={{ inventory_hostname }} epoch={{ dist_upgrade_started_epoch.stdout }}"
      when: ansible_facts.os_family == "Debian"

    - name: Perform dist-upgrade (Debian)
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        dpkg_options: force-confdef,force-confold
      register: dist_upgrade_result
      ignore_unreachable: true
      when: ansible_facts.os_family == "Debian"

    - name: Wait for host to return after upgrade disconnect
      ansible.builtin.wait_for_connection:
        delay: 10
        sleep: 10
        timeout: 900
      when:
        - ansible_facts.os_family == "Debian"
        - dist_upgrade_result.unreachable | default(false)

    - name: Refresh facts after upgrade reconnect
      ansible.builtin.setup:
      when:
        - ansible_facts.os_family == "Debian"
        - dist_upgrade_result.unreachable | default(false)

    - name: Capture dist-upgrade completion timestamp
      ansible.builtin.command:
        argv:
          - date
          - +%s
      register: dist_upgrade_finished_epoch
      changed_when: false
      when: ansible_facts.os_family == "Debian"

    - name: Log dist-upgrade result summary
      ansible.builtin.debug:
        msg:
          - "inventory_hostname={{ inventory_hostname }}"
          - "dist_upgrade_elapsed_seconds={{ (dist_upgrade_finished_epoch.stdout | int) - (dist_upgrade_started_epoch.stdout | int) }}"
          - "dist_upgrade_unreachable={{ dist_upgrade_result.unreachable | default(false) }}"
          - "dist_upgrade_changed={{ dist_upgrade_result.changed | default('unknown') }}"
          - "dist_upgrade_cache_updated={{ dist_upgrade_result.cache_updated | default('unknown') }}"
      when: ansible_facts.os_family == "Debian"

    - name: Check if a reboot is required (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false
      register: reboot_required_file
      when: ansible_facts.os_family == "Debian"

    - name: Log reboot-required packages
      ansible.builtin.command:
        argv:
          - cat
          - /var/run/reboot-required.pkgs
      register: reboot_required_packages
      changed_when: false
      failed_when: false
      when:
        - ansible_facts.os_family == "Debian"
        - reboot_required_file.stat.exists

    - name: Show reboot-required packages
      ansible.builtin.debug:
        var: reboot_required_packages.stdout_lines
      when:
        - ansible_facts.os_family == "Debian"
        - reboot_required_file.stat.exists

    - name: Reboot the server if required (Debian)
      ansible.builtin.reboot:
      when:
        - ansible_facts.os_family == "Debian"
        - reboot_required_file.stat.exists

    - name: Remove dependencies no longer required (Debian)
      ansible.builtin.apt:
        autoremove: true
        dpkg_options: force-confdef,force-confold
      when: ansible_facts.os_family == "Debian"
